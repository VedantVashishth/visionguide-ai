<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VisionGuide volunteer</title>
<style>body{margin:0;min-height:100vh;display:grid;place-content:center;gap:1rem;background:#071018;color:#eef8ff;font:16px system-ui,sans-serif;text-align:center;padding:1rem}video{width:min(92vw,900px);max-height:72vh;background:#000;border-radius:12px}button{justify-self:center;padding:.8rem 1.2rem;font:inherit;cursor:pointer}</style></head>
<body><h1>VisionGuide volunteer</h1><p id="status">Open the complete volunteer link shared by the caller.</p><button id="connectButton">Connect</button><video id="remoteVideo" autoplay playsinline controls></video>
<script>
const room=new URLSearchParams(location.search).get('room'),statusEl=document.getElementById('status'),button=document.getElementById('connectButton'),remoteVideo=document.getElementById('remoteVideo');let socket,peer,pendingCandidates=[];const rtcConfig={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
function signalingUrl(){return `${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws/signaling/${encodeURIComponent(room)}/receiver`;}
async function addCandidate(candidate){if(!peer||!peer.remoteDescription){pendingCandidates.push(candidate);return;}await peer.addIceCandidate(candidate);}
async function connect(){if(!room){statusEl.textContent='This link is missing its call room.';return;}button.disabled=true;socket=new WebSocket(signalingUrl());socket.onopen=()=>statusEl.textContent='Connected. Waiting for the caller…';socket.onerror=()=>{statusEl.textContent='Could not connect to the signaling server.';button.disabled=false;};socket.onclose=()=>{if(remoteVideo.srcObject)statusEl.textContent='Call ended.';};socket.onmessage=async({data})=>{const message=JSON.parse(data);if(message.type==='offer'){peer?.close();pendingCandidates=[];peer=new RTCPeerConnection(rtcConfig);peer.ontrack=({streams})=>{remoteVideo.srcObject=streams[0];statusEl.textContent='Live video connected.';};peer.onicecandidate=({candidate})=>candidate&&socket.send(JSON.stringify({type:'candidate',candidate}));await peer.setRemoteDescription(message.offer);for(const candidate of pendingCandidates.splice(0))await addCandidate(candidate);const answer=await peer.createAnswer();await peer.setLocalDescription(answer);socket.send(JSON.stringify({type:'answer',answer:peer.localDescription}));}else if(message.type==='candidate')await addCandidate(message.candidate);};}
button.addEventListener('click',connect);if(room)connect();
</script></body></html>
